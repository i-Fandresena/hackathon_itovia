server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15M;

    # Fallback pour le routage SPA React Router. index.html ne doit jamais
    # être mis en cache par le navigateur : sans ça, un onglet resté ouvert
    # d'un déploiement précédent peut continuer à servir un bundle JS dont
    # le fichier a depuis été remplacé (404 silencieux, page qui semble
    # "charger indéfiniment").
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Fichiers avec hash dans le nom (Vite) : sûrs à mettre en cache
    # longtemps, une nouvelle version change toujours de nom de fichier.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Proxy des requêtes API vers le backend Express
    location /api/ {
        proxy_pass http://host.docker.internal:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy des fichiers de CV téléversés vers Express
    location /uploads/ {
        proxy_pass http://host.docker.internal:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
